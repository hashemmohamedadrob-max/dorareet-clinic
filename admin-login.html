<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الإدارة | عيادة دوراريت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .login-card .brand-mark {
    margin: 0 auto 16px;
  }
  .login-card h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--teal-deep);
    margin: 0 0 6px;
  }
  .login-card p.sub {
    color: var(--teal-soft);
    font-size: 0.9rem;
    margin: 0 0 26px;
  }
  .login-card .form-row { text-align: right; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>لوحة إدارة عيادة دوراريت</h1>
    <p class="sub">سجّل الدخول لعرض وإدارة الحجوزات</p>

    <form id="login-form">
      <div class="form-row">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-row">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-submit">دخول</button>
      <p id="login-message" class="form-message"></p>
    </form>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const messageBox = document.getElementById('login-message');

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    const response = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const result = await response.json();

    if (result.success) {
      window.location.href = '/admin-dashboard.html';
    } else {
      messageBox.textContent = result.message;
      messageBox.className = 'form-message error';
    }
  } catch (err) {
    messageBox.textContent = 'تعذر الاتصال بالسيرفر.';
    messageBox.className = 'form-message error';
  }
});
</script>

</body>
</html>
